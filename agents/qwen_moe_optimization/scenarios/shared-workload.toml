# run_qwen3_235b_shared_workload.sh 的配置快照；不随脚本自动变化。
# P/D 各 2 个 H200 EP8 副本，Attention TP2、expert TP1；共 32 张模拟 GPU。
# P/D 每副本 token 预算 128/32、max_batch 32；KV whole，专家路由 seed 0。
# topology_pd_config 导出完整硬件与 KV 路由；仅指标，无 audit/trace。
# worker 使用启动环境的 Python；原生模型预设提供 Qwen3-235B-A22B 尺寸。


[system]
kind = "pd_disaggregation"
shared_execution = true
allow_gpu_sharing = false
kv_handoff = "whole"
tp = 1

[system.model]
kind = "qwen3_235b_a22b"

[system.network_sim]
kind = "flow"

[[system.prefill_instances]]
kind = "single_instance"

[system.prefill_instances.model_runner]
kind = "rooflang"
tp = 2
command = ["python", "scripts/rooflang_worker.py"]
graph_model = "qwen3_235b_a22b"
routing_seed = 0
instance_id = "p0"
shared_execution = true
stage = "p"
ep = 8
expert_tp = 1
attention_groups = [[0, 1], [2, 3], [4, 5], [6, 7]]

[system.prefill_instances.model_runner.hardware]
gpu_model = "h200"
gpu_count = 8
gpu_ids = ["cluster/n0-nvidia-h200-sxm-0", "cluster/n0-nvidia-h200-sxm-1", "cluster/n0-nvidia-h200-sxm-2", "cluster/n0-nvidia-h200-sxm-3", "cluster/n0-nvidia-h200-sxm-4", "cluster/n0-nvidia-h200-sxm-5", "cluster/n0-nvidia-h200-sxm-6", "cluster/n0-nvidia-h200-sxm-7"]

[system.prefill_instances.model_runner.hardware.topology]
links = []

[[system.prefill_instances.model_runner.hardware.topology.clusters]]
id = "cluster"
gpu_model = "h200"
n_nodes = 4

[system.prefill_instances.scheduler]
