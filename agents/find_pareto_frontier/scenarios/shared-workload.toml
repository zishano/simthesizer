# 取自 run_rooflang_shared_workload.sh 的实际参数；这是配置快照，不会自动随脚本变化。
# P/D 各 1 个 H200 TP4 实例；KV whole；不记录 audit/trace。
# 复用 topology_pd_config 生成；worker 用当前 Python，适用于容器 /opt/venv。

[system]
kind = "pd_disaggregation"
shared_execution = true
allow_gpu_sharing = false
kv_handoff = "whole"
tp = 1

[system.model]
kind = "llama3_1"
hidden_size = 4096
intermediate_size = 14336
max_position_embeddings = 131072
num_attention_heads = 32
num_hidden_layers = 32
num_key_value_heads = 8
vocab_size = 128256

[system.network_sim]
kind = "flow"

[[system.prefill_instances]]
kind = "single_instance"

[system.prefill_instances.model_runner]
kind = "rooflang"
tp = 4
command = ["python", "scripts/rooflang_worker.py"]
instance_id = "p0"
shared_execution = true
stage = "p"

[system.prefill_instances.model_runner.hardware]
gpu_model = "h200"
gpu_count = 4
gpu_ids = ["cluster/n0-nvidia-h200-sxm-0", "cluster/n0-nvidia-h200-sxm-1", "cluster/n0-nvidia-h200-sxm-2", "cluster/n0-nvidia-h200-sxm-3"]

[system.prefill_instances.model_runner.hardware.topology]
links = []

[[system.prefill_instances.model_runner.hardware.topology.clusters]]
id = "cluster"
gpu_model = "h200"
n_nodes = 1

[system.prefill_instances.scheduler]
kind = "chunked_prefill"
block_size = 16
max_batch = 32
max_num_batched_tokens = 128
device_mem = 144000000000
device_mem_utilization = 0.9
enable_prefix_caching = false

[system.prefill_instances.model]
kind = "llama3_1"
hidden_size = 4096
intermediate_size = 14336
max_position_embeddings = 131072
num_attention_heads = 32
num_hidden_layers = 32
num_key_value_heads = 8
vocab_size = 128256

[[system.decode_instances]]
kind = "single_instance"

[system.decode_instances.model_runner]
kind = "rooflang"
tp = 4
command = ["python", "scripts/rooflang_worker.py"]
instance_id = "d0"
shared_execution = true
stage = "d"

[system.decode_instances.model_runner.hardware]
gpu_model = "h200"
gpu_count = 4
gpu_ids = ["cluster/n0-nvidia-h200-sxm-4", "cluster/n0-nvidia-h200-sxm-5", "cluster/n0-nvidia-h200-sxm-6", "cluster/n0-nvidia-h200-sxm-7"]

[system.decode_instances.model_runner.hardware.topology]
links = []

[[system.decode_instances.model_runner.hardware.topology.clusters]]
id = "cluster"
gpu_model = "h200"
n_nodes = 1

[system.decode_instances.scheduler]
kind = "chunked_prefill"
block_size = 16
max_batch = 32
max_num_batched_tokens = 32
device_mem = 144000000000
device_mem_utilization = 0.9
enable_prefix_caching = false

[system.decode_instances.model]
kind = "llama3_1"
hidden_size = 4096
intermediate_size = 14336
max_position_embeddings = 131072
num_attention_heads = 32
num_hidden_layers = 32
num_key_value_heads = 8
vocab_size = 128256

[system.kv_topology]
