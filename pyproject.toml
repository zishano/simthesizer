[project]
name = "simthesizer"
version = "0.1.0"
description = "Simthesizer Python tooling"
requires-python = ">=3.14,<3.15"
dependencies = ["matplotlib>=3.9,<4", "networkx>=3.4,<4"]

[dependency-groups]
dev = ["ruff"]
vllm = ["vllm==0.31.0"]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["scripts/rooflang"]
