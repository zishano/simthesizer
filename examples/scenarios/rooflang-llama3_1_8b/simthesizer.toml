[system]
kind = "single_instance"

# Rooflang RTX 6000D preset; two allocated GPUs in its standard 8-GPU topology.
# Run from the repository root with Python able to import Rooflang dependencies.
[system.model_runner]
kind = "rooflang"
tp = 2
command = ["uv", "run", "--locked", "python", "scripts/rooflang_worker.py"]

[system.model_runner.hardware]
gpu_model = "rtx6000d"
gpu_count = 2

[system.scheduler]
kind = "chunked_prefill"
block_size = 16
max_batch = 32
max_num_batched_tokens = 2048
device_mem = 84000000000
device_mem_utilization = 0.9
enable_prefix_caching = false

[system.model]
kind = "llama3_1"
hidden_size = 4096
intermediate_size = 14336
max_position_embeddings = 131072
num_attention_heads = 32
num_hidden_layers = 32
num_key_value_heads = 8
vocab_size = 128256
